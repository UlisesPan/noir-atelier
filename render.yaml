# Blueprint de Render para la API. La base de datos vive en Neon (DATABASE_URL).
services:
  - type: web
    name: noir-atelier-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Las migraciones corren solas al arrancar (migrationsRun en producción); el seed es idempotente.
    startCommand: npm run seed:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@noiratelier.dev
      - key: ADMIN_PASSWORD
        sync: false
      # Clientes, órdenes y reseñas de ejemplo para que el portfolio no se vea vacío.
      - key: SEED_DEMO_DATA
        value: "true"
